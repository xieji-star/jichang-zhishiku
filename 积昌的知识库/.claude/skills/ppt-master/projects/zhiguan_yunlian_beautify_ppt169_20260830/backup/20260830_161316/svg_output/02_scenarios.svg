<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="conclGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F6B3A"/>
      <stop offset="100%" stop-color="#1F4A27"/>
    </linearGradient>
    <clipPath id="clip-p2-hero"><rect x="76" y="199" width="528" height="150" rx="12"/></clipPath>
  </defs>

  <!-- Background -->
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#F5F7EF" data-pptx-role="background"/>
  <circle id="deco-orbit" cx="1250" cy="78" r="205" fill="#EAF2E2" data-pptx-role="decoration"/>

  <!-- Header -->
  <g id="header" data-pptx-bounds="60 36 1160 128">
    <rect x="60" y="40" width="9" height="50" rx="4" fill="#2F6B3A"/>
    <text x="92" y="62" font-size="14" font-weight="bold" fill="#6FA84F">PART 02 · 应用场景</text>
    <text x="92" y="102" font-size="40" font-weight="bold" fill="#2F6B3A">应用场景</text>
    <text x="92" y="136" font-size="18" fill="#6B7260">围绕玉米生产全过程，覆盖田间管理与远程运维</text>
  </g>

  <!-- Hero scenario -->
  <g id="scenario-hero" data-pptx-bounds="60 183 560 304">
    <rect x="60" y="183" width="560" height="304" rx="18" fill="#FFFFFF" stroke="#E0E7D6" stroke-width="1.5"/>
    <image href="../images/p2_card1.png" x="76" y="199" width="528" height="150" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-p2-hero)"/>
    <text x="96" y="392" font-size="27" font-weight="bold" fill="#22301F">合作社示范田</text>
    <rect x="96" y="404" width="34" height="3" rx="1.5" fill="#6FA84F"/>
    <rect x="96" y="428" width="156" height="36" rx="10" fill="#EAF2E2"/>
    <text x="174" y="452" font-size="15" font-weight="bold" fill="#2F6B3A" text-anchor="middle">节水增效</text>
    <rect x="268" y="428" width="156" height="36" rx="10" fill="#EAF2E2"/>
    <text x="346" y="452" font-size="15" font-weight="bold" fill="#2F6B3A" text-anchor="middle">方案可复制</text>
    <rect x="440" y="428" width="156" height="36" rx="10" fill="#EAF2E2"/>
    <text x="518" y="452" font-size="15" font-weight="bold" fill="#2F6B3A" text-anchor="middle">带动增收</text>
  </g>

  <!-- Scenario card A -->
  <g id="scenario-a" data-pptx-bounds="648 183 572 140">
    <rect x="648" y="183" width="572" height="140" rx="18" fill="#FFFFFF" stroke="#E0E7D6" stroke-width="1.5"/>
    <text x="676" y="226" font-size="22" font-weight="bold" fill="#22301F">规模农场管理</text>
    <rect x="676" y="250" width="166" height="34" rx="10" fill="#EAF2E2"/>
    <text x="759" y="273" font-size="15" font-weight="bold" fill="#2F6B3A" text-anchor="middle">精准灌溉</text>
    <rect x="853" y="250" width="166" height="34" rx="10" fill="#EAF2E2"/>
    <text x="936" y="273" font-size="15" font-weight="bold" fill="#2F6B3A" text-anchor="middle">降本增产</text>
    <rect x="1030" y="250" width="166" height="34" rx="10" fill="#EAF2E2"/>
    <text x="1113" y="273" font-size="15" font-weight="bold" fill="#2F6B3A" text-anchor="middle">过程可控</text>
  </g>

  <!-- Scenario card B -->
  <g id="scenario-b" data-pptx-bounds="648 347 572 140">
    <rect x="648" y="347" width="572" height="140" rx="18" fill="#FFFFFF" stroke="#E0E7D6" stroke-width="1.5"/>
    <text x="676" y="390" font-size="22" font-weight="bold" fill="#22301F">远程监控运维</text>
    <rect x="676" y="414" width="166" height="34" rx="10" fill="#EAF2E2"/>
    <text x="759" y="437" font-size="15" font-weight="bold" fill="#2F6B3A" text-anchor="middle">远程看控</text>
    <rect x="853" y="414" width="166" height="34" rx="10" fill="#EAF2E2"/>
    <text x="936" y="437" font-size="15" font-weight="bold" fill="#2F6B3A" text-anchor="middle">异常预警</text>
    <rect x="1030" y="414" width="166" height="34" rx="10" fill="#EAF2E2"/>
    <text x="1113" y="437" font-size="15" font-weight="bold" fill="#2F6B3A" text-anchor="middle">运维高效</text>
  </g>

  <!-- Tag chain -->
  <g id="tags" data-pptx-bounds="60 552 1160 44">
    <rect x="60" y="554" width="92" height="38" rx="19" fill="#EAF2E2"/>
    <text x="106" y="580" font-size="15" font-weight="bold" fill="#2F6B3A" text-anchor="middle">看得见</text>
    <path d="M 164 573 L 172 573" fill="none" stroke="#6FA84F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 178 567 L 186 573 L 178 579" fill="none" stroke="#6FA84F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="198" y="554" width="92" height="38" rx="19" fill="#EAF2E2"/>
    <text x="244" y="580" font-size="15" font-weight="bold" fill="#2F6B3A" text-anchor="middle">管得住</text>
    <path d="M 302 573 L 310 573" fill="none" stroke="#6FA84F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 316 567 L 324 573 L 316 579" fill="none" stroke="#6FA84F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="336" y="554" width="92" height="38" rx="19" fill="#EAF2E2"/>
    <text x="382" y="580" font-size="15" font-weight="bold" fill="#2F6B3A" text-anchor="middle">用得起</text>
  </g>

  <!-- Conclusion banner -->
  <g id="conclusion" data-pptx-bounds="60 606 1160 72">
    <rect x="60" y="606" width="1160" height="72" rx="18" fill="url(#conclGrad)"/>
    <circle cx="106" cy="642" r="18" fill="#FFFFFF" fill-opacity="0.16"/>
    <path d="M 98 642 L 104 649 L 114 636" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="142" y="650" font-size="24" font-weight="bold" fill="#FFFFFF">从设备落地到数据回流，形成真正可用的应用场景</text>
  </g>
